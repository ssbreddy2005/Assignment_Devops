<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Marginalia — notes that breathe</title>
<meta name="description" content="A vivid, block-based note-taking workspace. Fast, offline-ready, installable on your phone." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7C5CFC" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Marginalia" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app" class="app">

  <!-- Mobile top bar -->
  <header class="topbar">
    <button class="icon-btn" id="menuToggle" aria-label="Open menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar-title" id="topbarTitle">Marginalia</div>
    <button class="icon-btn" id="searchToggle" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </header>

  <div class="shell">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5" fill="none"/><path d="M8 12h6M8 15h8M8 9h4"/></svg>
          </span>
          <span class="brand-name">Marginalia</span>
        </div>
        <button class="icon-btn ghost" id="themeToggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>

      <button class="search-pill" id="searchPill">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Search &amp; jump to…</span>
        <kbd>Ctrl K</kbd>
      </button>

      <div class="sidebar-section-label">Pages</div>
      <div class="page-tree" id="pageTree"></div>

      <button class="new-page-btn" id="newPageBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New page
      </button>

      <div class="sidebar-foot">
        <div class="storage-note">Stored privately on this device</div>
      </div>
    </nav>
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- Editor -->
    <main class="editor-pane" id="editorPane">
      <div class="editor-topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="editor-topbar-actions">
          <button class="chip-btn" id="exportBtn" title="Export as Markdown">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            Export
          </button>
          <button class="chip-btn danger" id="deletePageBtn" title="Delete page">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>
            Delete
          </button>
        </div>
      </div>

      <div class="page-scroll" id="pageScroll">
        <div class="page-header" id="pageHeader">
          <button class="page-icon-btn" id="pageIconBtn">📝</button>
          <div class="spine-row" id="spineRow"></div>
          <h1 class="page-title" id="pageTitle" contenteditable="true" data-placeholder="Untitled"></h1>
          <div class="page-meta" id="pageMeta"></div>
        </div>

        <div class="blocks" id="blocks"></div>

        <button class="add-block-hint" id="addBlockHint">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Click to add a block, or type <kbd>/</kbd> for options
        </button>
      </div>
    </main>

    <div class="empty-state" id="emptyState">
      <div class="empty-card">
        <div class="empty-glyph">✦</div>
        <h2>No page open yet</h2>
        <p>Create your first page, or pick one from the sidebar.</p>
        <button class="primary-btn" id="emptyNewPageBtn">Create a page</button>
      </div>
    </div>
  </div>

  <!-- Floating action button (mobile) -->
  <button class="fab" id="fab" aria-label="New page">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Selection toolbar for inline formatting -->
  <div class="selection-toolbar" id="selectionToolbar">
    <button data-cmd="bold" title="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic"><i>I</i></button>
    <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
    <button data-cmd="code" title="Inline code">&lt;/&gt;</button>
    <button data-cmd="link" title="Link">🔗</button>
  </div>

  <!-- Slash / block-type menu -->
  <div class="slash-menu" id="slashMenu"></div>

  <!-- Emoji picker -->
  <div class="emoji-popover" id="emojiPopover"></div>

  <!-- Command palette / search modal -->
  <div class="palette-overlay" id="paletteOverlay">
    <div class="palette">
      <div class="palette-input-row">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="paletteInput" placeholder="Search pages and text…" autocomplete="off" />
        <kbd>Esc</kbd>
      </div>
      <div class="palette-results" id="paletteResults"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
